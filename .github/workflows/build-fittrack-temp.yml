name: Build FitTrack APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-fittrack-temp.yml'
      - '.fittrack-build-trigger'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fittrack-build-v12

      - name: Reconstruct project
        shell: bash
        run: |
          cat .fittrack/part-* | base64 -d > /tmp/fittrack.zip
          mkdir -p fittrack
          unzip -q /tmp/fittrack.zip -d fittrack
          test -f fittrack/settings.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: fittrack
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v12-debug
          path: fittrack/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
