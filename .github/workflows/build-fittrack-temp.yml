name: Build FitTrack APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-fittrack-temp.yml'
      - '.fittrack-build-trigger'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: fittrack-build-v12

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euxo pipefail
          cat fittrack-build/src.part*.b64 > /tmp/fittrack-source.b64
          base64 --decode /tmp/fittrack-source.b64 > /tmp/fittrack-source.zip
          unzip -t /tmp/fittrack-source.zip
          mkdir -p fittrack
          unzip -q /tmp/fittrack-source.zip -d fittrack
          test -f fittrack/settings.gradle.kts
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\nkotlin.daemon.jvmargs=-Xmx2g\norg.gradle.workers.max=2\n' > fittrack/gradle.properties
          sed -i 's/version "8.7.3"/version "8.9.1"/' fittrack/build.gradle.kts
          sed -i 's/compileSdk = 35/compileSdk = 36/' fittrack/app/build.gradle.kts
          sed -i '/namespace = "com.lightme.fittrack"/a\\    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }' fittrack/app/build.gradle.kts
          python3 .github/fittrack-fix-source.py fittrack
          ls -la fittrack

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: fittrack
        shell: bash
        run: gradle --no-daemon :app:assembleDebug --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=fittrack/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload FitTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v12-debug
          path: fittrack/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
