name: Build FitTrack APK

on:
  push:
    branches:
      - fittrack-build-v12
    paths:
      - '.github/workflows/fittrack-build.yml'
      - 'fittrack-build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euxo pipefail
          cat fittrack-build/src.part*.b64 > /tmp/fittrack-source.b64
          base64 --decode /tmp/fittrack-source.b64 > /tmp/fittrack-source.zip
          unzip -t /tmp/fittrack-source.zip
          mkdir -p fittrack-src
          unzip -q /tmp/fittrack-source.zip -d fittrack-src
          test -f fittrack-src/settings.gradle.kts
          cat > fittrack-src/gradle.properties <<'EOF'
android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.workers.max=2
EOF
          ls -la fittrack-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          ls -la "$ANDROID_SDK_ROOT/platforms/android-35"
          ls -la "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: fittrack-src
        shell: bash
        run: gradle --no-daemon :app:assembleDebug --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=fittrack-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload FitTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v12-debug-apk
          path: fittrack-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
