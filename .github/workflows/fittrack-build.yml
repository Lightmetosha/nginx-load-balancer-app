name: Build FitTrack APK

on:
  push:
    branches:
      - fittrack-build-v12
    paths:
      - '.github/workflows/fittrack-build.yml'
      - 'fittrack-build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euxo pipefail
          cat fittrack-build/src.part*.b64 > /tmp/fittrack-source.b64
          base64 --decode /tmp/fittrack-source.b64 > /tmp/fittrack-source.zip
          unzip -t /tmp/fittrack-source.zip
          mkdir -p fittrack-src
          unzip -q /tmp/fittrack-source.zip -d fittrack-src
          ls -la fittrack-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: fittrack-src
        shell: bash
        run: gradle --no-daemon :app:assembleDebug --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          test -f fittrack-src/app/build/outputs/apk/debug/app-debug.apk
          ls -lh fittrack-src/app/build/outputs/apk/debug/app-debug.apk
          sha256sum fittrack-src/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload FitTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v12-debug-apk
          path: fittrack-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
