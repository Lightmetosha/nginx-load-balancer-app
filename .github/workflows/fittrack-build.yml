name: Build FitTrack APK

on:
  push:
    branches:
      - fittrack-build-v12
    paths:
      - '.github/workflows/fittrack-build.yml'
      - 'fittrack-build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euxo pipefail
          cat fittrack-build/src.part*.b64 > /tmp/fittrack-source.b64
          base64 --decode /tmp/fittrack-source.b64 > /tmp/fittrack-source.zip
          unzip -t /tmp/fittrack-source.zip
          mkdir -p fittrack-src
          unzip -q /tmp/fittrack-source.zip -d fittrack-src
          test -f fittrack-src/settings.gradle.kts
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\nkotlin.daemon.jvmargs=-Xmx2g\norg.gradle.workers.max=2\n' > fittrack-src/gradle.properties
          sed -i 's/version "8.7.3"/version "8.9.1"/' fittrack-src/build.gradle.kts
          sed -i 's/compileSdk = 35/compileSdk = 36/' fittrack-src/app/build.gradle.kts
          sed -i '/namespace = "com.lightme.fittrack"/a\\    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }' fittrack-src/app/build.gradle.kts
          python3 .github/fittrack-fix-source.py fittrack-src
          ls -la fittrack-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
          ls -la "$ANDROID_SDK_ROOT/platforms/android-36"
          ls -la "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: fittrack-src
        shell: bash
        run: gradle --no-daemon :app:assembleDebug --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=fittrack-src/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload FitTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v12-debug-apk
          path: fittrack-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
