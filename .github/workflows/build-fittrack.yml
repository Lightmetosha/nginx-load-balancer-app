name: Build FitTrack APK

on:
  push:
    branches:
      - fittrack-build-v12

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct project
        shell: bash
        run: |
          cat .fittrack/part-* | base64 -d > /tmp/fittrack.zip
          rm -rf fittrack
          mkdir -p fittrack
          unzip -q /tmp/fittrack.zip -d fittrack
          test -f fittrack/settings.gradle.kts
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" > fittrack/gradle.properties
          ls -la /usr/local/lib/android/sdk/platforms || true
          ls -la /usr/local/lib/android/sdk/build-tools || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: fittrack
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v12-debug
          path: fittrack/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
