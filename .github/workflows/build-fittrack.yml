name: Build FitTrack APK

on:
  push:
    branches:
      - fittrack-build-v12

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct project
        shell: bash
        run: |
          cat .fittrack/part-* | base64 -d > /tmp/fittrack.zip
          rm -rf fittrack
          mkdir -p fittrack
          unzip -q /tmp/fittrack.zip -d fittrack
          test -f fittrack/settings.gradle.kts
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\nkotlin.daemon.jvmargs=-Xmx2g\norg.gradle.workers.max=2\n" > fittrack/gradle.properties
          sed -i 's/version "8.7.3"/version "8.9.1"/' fittrack/build.gradle.kts
          sed -i 's/compileSdk = 35/compileSdk = 36/' fittrack/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path("fittrack/app/build.gradle.kts")
          s = p.read_text()
          needle = '    namespace = "com.lightme.fittrack"\n'
          insert = '''    namespace = "com.lightme.fittrack"
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
'''
          if needle in s and "compileOptions {" not in s:
              s = s.replace(needle, insert, 1)
          p.write_text(s)
          PY
          ls -la /usr/local/lib/android/sdk/platforms || true
          ls -la /usr/local/lib/android/sdk/build-tools || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: fittrack
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack-v12-debug
          path: fittrack/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
